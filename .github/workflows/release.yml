name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install release check deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          sudo apt-get update && sudo apt-get install -y shellcheck zsh

      - name: Validate release inputs
        run: |
          set -eu
          version=$(sed -n 's/^CCS_VERSION=//p' bin/ccs)
          test "${GITHUB_REF_NAME}" = "v${version}"
          # install.sh ships pinned to the tag being released: a stale pin
          # would make `curl | sh` install the previous version (or fail the
          # checksum outright). Both defaults must match this tag's bin/ccs.
          pinned_ref=$(sed -n 's/^ref=.{CCS_INSTALL_REF:-\(.*\)}$/\1/p' install.sh)
          test "$pinned_ref" = "v${version}"
          pinned_sha=$(sed -n 's/^expected_sha256=.{CCS_INSTALL_SHA256:-\(.*\)}$/\1/p' install.sh)
          test "$pinned_sha" = "$(sha256sum bin/ccs | awk '{print $1}')"
          sh -n bin/ccs
          sh -n install.sh
          shellcheck -s sh bin/ccs install.sh
          bash -n completions/ccs.bash
          zsh -n completions/_ccs
          pytest tests/ -q
          unsafe='--danger'"ously-skip-permissions"
          ! git grep -n -- "$unsafe" README.md docs CONTRIBUTING.md SECURITY.md CHANGELOG.md

      - name: Build release archive
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          pkg="dist/pkg"
          mkdir -p "$pkg/completions"
          install -m 755 bin/ccs "$pkg/ccs"
          install -m 755 install.sh "$pkg/install.sh"
          cp completions/ccs.bash "$pkg/completions/ccs.bash"
          cp completions/_ccs "$pkg/completions/_ccs"
          cp README.md README.zh.md LICENSE CHANGELOG.md CONTRIBUTING.md SECURITY.md "$pkg/"
          git ls-files docs | while IFS= read -r path; do
            mkdir -p "$pkg/$(dirname "$path")"
            cp "$path" "$pkg/$path"
          done
          tar -C "$pkg" -czf "dist/ccs-${tag}.tar.gz" .
          (cd dist && sha256sum "ccs-${tag}.tar.gz" >"ccs-${tag}.sha256")
          sha256sum bin/ccs | awk '{print $1}' >"dist/bin-ccs-${tag}.sha256"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "dist/ccs-${tag}.tar.gz" "dist/ccs-${tag}.sha256" "dist/bin-ccs-${tag}.sha256" --clobber
          else
            gh release create "$tag" "dist/ccs-${tag}.tar.gz" "dist/ccs-${tag}.sha256" "dist/bin-ccs-${tag}.sha256" \
              --title "$tag" \
              --generate-notes \
              --verify-tag
          fi
