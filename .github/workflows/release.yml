name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build release archive
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          pkg="dist/pkg"
          mkdir -p "$pkg/completions" "$pkg/docs"
          install -m 755 bin/ccs "$pkg/ccs"
          install -m 755 install.sh "$pkg/install.sh"
          cp completions/ccs.bash "$pkg/completions/ccs.bash"
          cp completions/_ccs "$pkg/completions/_ccs"
          cp README.md LICENSE CHANGELOG.md CONTRIBUTING.md SECURITY.md "$pkg/"
          cp docs/providers.md docs/releasing.md "$pkg/docs/"
          tar -C "$pkg" -czf "dist/ccs-${tag}.tar.gz" .
          (cd dist && sha256sum "ccs-${tag}.tar.gz" >"ccs-${tag}.sha256")

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "dist/ccs-${tag}.tar.gz" "dist/ccs-${tag}.sha256" --clobber
          else
            gh release create "$tag" "dist/ccs-${tag}.tar.gz" "dist/ccs-${tag}.sha256" \
              --title "$tag" \
              --generate-notes \
              --verify-tag
          fi
