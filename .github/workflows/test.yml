name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
        exclude:
          - os: macos-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.11"

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Shell syntax
        run: |
          sh -n bin/ccs
          sh -n install.sh

      - name: Run pytest
        run: pytest tests/ -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ruff and shellcheck
        run: |
          python -m pip install ruff
          sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Shell syntax
        run: |
          sh -n bin/ccs
          sh -n install.sh

      - name: Shellcheck
        run: shellcheck -s sh bin/ccs install.sh

      - name: Tracked docs safety
        run: |
          unsafe='--danger'"ously-skip-permissions"
          ! git grep -n -- "$unsafe" README.md docs CONTRIBUTING.md SECURITY.md CHANGELOG.md

      - name: Ruff check
        run: ruff check tests

      - name: Ruff format
        run: ruff format --check tests
